[project]
name = "download-emails"
version = "0.1.0"
description = "Download the emails in a Gmail label to readable text files, read-only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
]
